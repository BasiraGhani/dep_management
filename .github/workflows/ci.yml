name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check . && ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

  backend-postgres:
    name: Backend tests on PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dept_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dept_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py runs the migrations and the whole suite against this database.
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dept_test
      # The app's settings (loaded by Alembic) require a SECRET_KEY. CI has no .env;
      # this is a throwaway test value, like the one conftest.py sets for pytest.
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations (upgrade, check, downgrade, upgrade)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Pytest (PostgreSQL)
        run: pytest -q

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run

      - name: Build
        run: npm run build

  docker:
    name: Docker stack (compose up + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create .env for the stack
        # Throwaway CI values; a real deployment copies .env.example and sets its own.
        run: |
          cat > .env <<'ENV'
          POSTGRES_PASSWORD=ci-postgres-password
          SECRET_KEY=ci-test-secret-key-not-for-production-0123456789
          FIRST_ADMIN_USERNAME=admin
          FIRST_ADMIN_PASSWORD=ci-admin-password
          SEED_DEMO=true
          ENV

      - name: Build and start (db, backend, frontend)
        run: |
          docker compose up --build --detach --wait --wait-timeout 300 2>&1 | tee compose-up.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Smoke test at http://localhost
        run: |
          set -eu
          page() { curl -fsS "http://localhost$1"; }
          login() {
            curl -fsS -X POST http://localhost/api/v1/auth/login -d "username=$1&password=$2" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["access_token"])'
          }
          page / | grep -q '<div id="root">'
          page /courses/1 | grep -q '<div id="root">'   # client-side route -> index.html
          page /api/v1/health | grep -q '"ok"'          # Nginx proxies /api to the backend
          asset=$(page / | grep -o '/assets/[^"]*\.js' | head -n 1)
          curl -fsSI "http://localhost$asset" | grep -qi 'cache-control: public, immutable'
          # Security headers (T8.4). GET (not HEAD: the API only answers GET), and
          # strip the CR at the end of each header line before matching.
          headers=$(curl -fsS -D - -o /dev/null http://localhost/ | tr -d '\r')
          for h in content-security-policy x-content-type-options x-frame-options referrer-policy; do
            echo "$headers" | grep -qi "^$h:" || { echo "missing header: $h"; exit 1; }
          done
          curl -fsS -D - -o /dev/null http://localhost/api/v1/health | tr -d '\r' \
            | grep -qi '^x-frame-options: DENY$'               # API responses get them too
          echo "$headers" | grep -qi '^server: nginx$'          # no version number shown
          # Failed-login throttle: a fake X-Forwarded-For per attempt must not get around it.
          for i in 1 2 3 4 5; do
            curl -s -o /dev/null -H "X-Forwarded-For: 10.0.0.$i" -X POST http://localhost/api/v1/auth/login \
              -d 'username=ci.nobody&password=wrong-password'
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-For: 10.0.0.99' \
            -X POST http://localhost/api/v1/auth/login -d 'username=ci.nobody&password=wrong-password')
          test "$code" = 429 || { echo "expected 429 after repeated failures, got $code"; exit 1; }
          token=$(login admin ci-admin-password)        # first admin from .env
          curl -fsS http://localhost/api/v1/dashboard -H "Authorization: Bearer $token" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["role"] == "admin" and d["totals"]["students"] == 60, d; print("admin dashboard:", d["totals"])'
          login demo.student demo-password > /dev/null  # demo data (SEED_DEMO=true)
          echo "Smoke test passed"

      - name: Restart keeps the data (volume; migrations and seeds are safe to repeat)
        run: |
          docker compose restart backend
          docker compose up --detach --wait --wait-timeout 120
          curl -fsS -X POST http://localhost/api/v1/auth/login -d 'username=demo.hod&password=demo-password' > /dev/null
          echo "Backend restarted; data kept"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Playwright (Chromium)
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: End-to-end smoke test (Playwright, one key action per role)
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost
        run: npm run e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Logs
        if: failure()
        # Also published as annotations, so the cause shows on the PR's checks page.
        run: |
          {
            echo "== docker compose up (last lines)"; tail -n 30 compose-up.log 2>/dev/null || true
            echo "== docker compose ps"; docker compose ps --all
            for service in db backend frontend; do
              echo "== $service logs (last lines)"; docker compose logs --no-color --tail 25 "$service"
            done
          } > diagnostics.txt 2>&1
          cat diagnostics.txt
          split -l 40 diagnostics.txt part-
          for part in part-*; do
            echo "::error title=Docker stack diagnostics ($part)::$(sed 's/%/%25/g' "$part" | awk '{printf "%s%%0A", $0}')"
          done

      - name: Stop
        if: always()
        run: docker compose down --volumes
