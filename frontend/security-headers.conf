# Security headers (T8.4), included by every location in nginx.conf: a location
# that sets its own add_header doesn't inherit the server-level ones.
#
# CSP: scripts, styles, images and API calls from this origin only. No inline
# scripts or style attributes are needed (React sets styles through the DOM), so
# none are allowed; this limits what an XSS bug could do with the stored token.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
